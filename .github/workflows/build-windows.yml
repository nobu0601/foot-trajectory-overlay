# Windows 用 exe を作る。
# - v で始まるタグ（例: v0.2.0）を push すると、Releases に zip を公開する
# - Actions 画面の「Run workflow」からも手動で実行できる（成果物は Artifacts に置かれる）
name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (CPU 版 torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt pyinstaller

      - name: Unit tests
        run: python -m pytest -q

      - name: Download models (exe に同梱する)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          foreach ($m in "yolo11n.pt", "yolo11s.pt") {
            Invoke-WebRequest "https://github.com/ultralytics/assets/releases/download/v8.3.0/$m" -OutFile "models/$m"
          }

      - name: Build exe
        run: pyinstaller --noconfirm FootTrajectoryCounter.spec

      - name: Smoke test (exe で実際の歩行者動画を解析・カウント)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          Invoke-WebRequest "https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/vtest.avi" -OutFile "smoke/テスト動画.avi"
          $exe = "dist/FootTrajectoryCounter/FootTrajectoryCounter.exe"
          # ネット接続なしでも動くよう、モデル名だけを渡して同梱モデルが使われることを確認する
          $p = Start-Process -FilePath $exe -ArgumentList '--cli', 'smoke/テスト動画.avi', '--max-frames', '150', '--line', '400,150,400,420', '--suggest', '2000' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA/FootTrajectoryCounter/log.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "exe exited with $($p.ExitCode)" }
          foreach ($f in "overlay.png", "count_result.png", "counts.csv", "tracks.csv", "suggestions.csv", "suggestions.png") {
            if (-not (Test-Path "smoke/テスト動画_overlay/$f")) { throw "missing $f" }
          }
          Get-Content "smoke/テスト動画_overlay/counts.csv"
          Get-Content "smoke/テスト動画_overlay/suggestions.csv"

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md dist/FootTrajectoryCounter/README.md
          Compress-Archive -Path dist/FootTrajectoryCounter -DestinationPath FootTrajectoryCounter-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FootTrajectoryCounter-windows
          path: FootTrajectoryCounter-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FootTrajectoryCounter-windows.zip
